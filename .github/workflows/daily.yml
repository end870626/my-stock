name: 每日更新三大法人買賣超

on:
  schedule:
    # UTC 08:20 = 台北時間 16:20，週一到週五（台股收盤後三大法人資料釋出時間）
    - cron: "20 8 * * 1-5"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動點擊執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 執行抓取程式
        run: python fetch_institutional.py

      - name: 提交更新後的資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/summary.json
          git diff --staged --quiet || git commit -m "自動更新三大法人資料 $(date +'%Y-%m-%d')"
          git push
